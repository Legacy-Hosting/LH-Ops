name: Operations CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Run ShellCheck
        run: shellcheck --severity=error scripts/*.sh
      - name: Check backup security policy
        run: bash tests/backup-policy.sh
      - name: Exercise encrypted backup and restore flow
        run: sudo bash tests/backup-integration.sh
      - name: Exercise persistent-file backup and staged restore
        run: sudo bash tests/application-backup-integration.sh
      - name: Check executable scripts
        run: test "$(find scripts -maxdepth 1 -type f -name '*.sh' ! -perm -111 | wc -l)" -eq 0
      - name: Reject committed secret-shaped files
        run: |
          test "$(find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.tfstate' -o -name '*.age' \) -not -path './.git/*' | wc -l)" -eq 0
